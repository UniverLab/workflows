name: Rust CI

on:
  workflow_call:
    inputs:
      rust-version:
        description: "Rust version (default: stable)"
        type: string
        default: "stable"
      system-packages:
        description: "Space-separated system packages to install (e.g., 'protobuf-compiler libssl-dev')"
        type: string
        default: ""
      check-fmt:
        description: "Run cargo fmt --check"
        type: boolean
        default: true
      run-clippy:
        description: "Run clippy linter"
        type: boolean
        default: true
      run-tests:
        description: "Run cargo test"
        type: boolean
        default: true
      publish-check:
        description: "Run cargo publish --dry-run"
        type: boolean
        default: true
      max-package-mib:
        description: "Fail publish-check if the packaged .crate exceeds this size. Defaults to 9, one under the 10 MiB crates.io enforces, so a PR fails with headroom instead of at the cliff."
        type: number
        default: 9
      feature-flags:
        description: "Cargo feature selection for clippy, tests and coverage. Defaults to --all-features. Set to an empty string for default features, or to '--features a,b' — needed when an optional feature pulls a native dependency the runners do not carry."
        type: string
        default: "--all-features"
      use-nextest:
        description: "Run tests and coverage with cargo-nextest instead of cargo test. nextest runs each test in its own process, so tests that touch process-global state (env vars, current dir, signal handlers) stay isolated instead of racing each other. Opt-in because nextest does not run doctests: enable it only where the local gate already uses nextest, so CI reproduces what developers run."
        type: boolean
        default: false
      run-coverage:
        description: "Measure test coverage with cargo-llvm-cov"
        type: boolean
        default: true
      coverage-ignore-regex:
        description: "Optional --ignore-filename-regex for coverage, to keep code whose correctness is not logical (e.g. pure rendering) out of the gate. Matched against full paths, so do not anchor with ^."
        type: string
        default: ""
      coverage-threshold:
        description: "Fail if line coverage drops below this percent (0 = report only)"
        type: number
        default: 80
      main-pr-checks:
        description: "Validate version bump on main PR"
        type: boolean
        default: true

# CI only reads the checkout — least privilege. Release/publish workflows
# request write where they actually need it.
permissions:
  contents: read

# A newer push to the same ref supersedes in-flight CI; cancel the stale run.
concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-version }}
          components: rustfmt, clippy

      - name: Install system packages
        if: inputs.system-packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.system-packages }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        if: inputs.check-fmt
        run: cargo fmt -- --check

      - name: Run clippy
        if: inputs.run-clippy
        run: cargo clippy --locked --all-targets ${{ inputs.feature-flags }} -- -D warnings

      - uses: taiki-e/install-action@nextest
        if: inputs.run-tests && inputs.use-nextest

      - name: Run tests
        if: inputs.run-tests
        run: |
          if [ "${{ inputs.use-nextest }}" = "true" ]; then
            cargo nextest run --locked ${{ inputs.feature-flags }}
          else
            cargo test --locked ${{ inputs.feature-flags }}
          fi

  publish-check:
    name: Publish Check
    if: inputs.publish-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-version }}

      - name: Install system packages
        if: inputs.system-packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.system-packages }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Dry-run publish
        run: cargo publish --locked --dry-run

      # The dry run packages and verifies locally but never uploads, and the
      # size ceiling only exists server-side — so a green dry run says nothing
      # about whether the publish will fit. crates.io does not reject an
      # oversized upload cleanly either: it resets the HTTP/2 stream, which
      # reads like a network fault. Measure the .crate the dry run already
      # produced and fail here, where the log can name the offending file.
      - name: Check package size
        run: |
          crate=$(ls -1 target/package/*.crate 2>/dev/null | head -1)
          if [ -z "$crate" ]; then
            echo "No .crate produced by the dry run — nothing to measure."
            exit 0
          fi
          size=$(stat -c%s "$crate")
          limit=$(( ${{ inputs.max-package-mib }} * 1024 * 1024 ))
          printf 'Package: %s\nSize:    %s bytes (%.2f MiB)\nLimit:   %s MiB\n' \
            "$crate" "$size" "$(echo "$size" | awk '{print $1/1048576}')" \
            "${{ inputs.max-package-mib }}"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::Package exceeds ${{ inputs.max-package-mib }} MiB; crates.io rejects uploads over 10 MiB."
            echo "Largest files in the package:"
            cargo package --locked --list --allow-dirty 2>/dev/null \
              | while read -r f; do
                  [ -f "$f" ] && printf '%10s  %s\n' "$(stat -c%s "$f")" "$f"
                done | sort -rn | head -10
            echo "Fix: add an 'exclude' list to Cargo.toml so assets stay out of the package."
            exit 1
          fi

  coverage:
    name: Coverage
    if: inputs.run-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-version }}
          components: llvm-tools-preview

      - name: Install system packages
        if: inputs.system-packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.system-packages }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: taiki-e/install-action@nextest
        if: inputs.use-nextest

      # --fail-under-lines 0 is a pure report; pass coverage-threshold to gate.
      #
      # The runner has to match the check job's: coverage re-runs the whole
      # suite, so a suite that only holds together under nextest's
      # process-per-test isolation would fail here for reasons that have
      # nothing to do with coverage.
      - name: Measure coverage
        env:
          IGNORE_REGEX: ${{ inputs.coverage-ignore-regex }}
        run: |
          ignore=""
          if [ -n "$IGNORE_REGEX" ]; then
            ignore="--ignore-filename-regex $IGNORE_REGEX"
          fi
          runner=""
          if [ "${{ inputs.use-nextest }}" = "true" ]; then
            runner="nextest"
          fi
          cargo llvm-cov $runner --locked ${{ inputs.feature-flags }} $ignore \
            --fail-under-lines ${{ inputs.coverage-threshold }} \
            --summary-only

  main-pr-checks:
    name: Main PR Version Bump
    if: >-
      inputs.main-pr-checks &&
      github.event_name == 'pull_request' &&
      github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version bump
        run: |
          CURRENT_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "//' | sed 's/".*//')
          BASE_VERSION=$(git show origin/main:Cargo.toml | grep '^version' | head -1 | sed 's/version = "//' | sed 's/".*//')

          if [ "$CURRENT_VERSION" = "$BASE_VERSION" ]; then
            echo "❌ Version in Cargo.toml must be bumped for main PR"
            exit 1
          fi
          echo "✅ Version bumped: $BASE_VERSION → $CURRENT_VERSION"
