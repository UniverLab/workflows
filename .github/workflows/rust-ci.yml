name: Rust CI

on:
  workflow_call:
    inputs:
      rust-version:
        description: "Rust version (default: stable)"
        type: string
        default: "stable"
      system-packages:
        description: "Space-separated system packages to install (e.g., 'protobuf-compiler libssl-dev')"
        type: string
        default: ""
      check-fmt:
        description: "Run cargo fmt --check"
        type: boolean
        default: true
      run-clippy:
        description: "Run clippy linter"
        type: boolean
        default: true
      run-tests:
        description: "Run cargo test"
        type: boolean
        default: true
      publish-check:
        description: "Run cargo publish --dry-run"
        type: boolean
        default: true
      max-package-mib:
        description: "Fail publish-check if the packaged .crate exceeds this size. Defaults to 9, one under the 10 MiB crates.io enforces, so a PR fails with headroom instead of at the cliff."
        type: number
        default: 9
      feature-flags:
        description: "Cargo feature selection for clippy, tests and coverage. Defaults to --all-features. Set to an empty string for default features, or to '--features a,b' — needed when an optional feature pulls a native dependency the runners do not carry."
        type: string
        default: "--all-features"
      use-nextest:
        description: "Run tests and coverage with cargo-nextest instead of cargo test. nextest runs each test in its own process, so tests that touch process-global state (env vars, current dir, signal handlers) stay isolated instead of racing each other. Opt-in because nextest does not run doctests: enable it only where the local gate already uses nextest, so CI reproduces what developers run."
        type: boolean
        default: false
      run-coverage:
        description: "Measure test coverage with cargo-llvm-cov"
        type: boolean
        default: true
      coverage-ignore-regex:
        description: "Optional --ignore-filename-regex for coverage, to keep code whose correctness is not logical (e.g. pure rendering) out of the gate. Matched against full paths, so do not anchor with ^."
        type: string
        default: ""
      coverage-threshold:
        description: "Fail if line coverage drops below this percent (0 = report only)"
        type: number
        default: 80
      run-quality:
        description: "Run the lab's quality gate (scripts/rust-quality.sh in UniverLab/workflows): file size, strict clippy size/complexity lints, cargo-deny, cargo-machete. On by default — strict for every crate, decided 2026-09-29. Relax a threshold below instead of turning the gate off."
        type: boolean
        default: true
      quality-max-file-lines:
        description: "Maximum lines per src/**/*.rs file (tests exempt)"
        type: number
        default: 800
      quality-fn-lines:
        description: "clippy too-many-lines-threshold (lines per function)"
        type: number
        default: 100
      quality-cognitive:
        description: "clippy cognitive-complexity-threshold"
        type: number
        default: 25
      quality-nesting:
        description: "clippy excessive-nesting-threshold"
        type: number
        default: 5
      quality-args:
        description: "clippy too-many-arguments-threshold"
        type: number
        default: 7
      quality-type-complexity:
        description: "clippy type-complexity-threshold"
        type: number
        default: 250
      run-deny:
        description: "Run cargo-deny (advisories, bans, licenses, sources) inside the quality gate. Uses the crate's deny.toml, else config/deny.toml from UniverLab/workflows."
        type: boolean
        default: true
      run-machete:
        description: "Run cargo-machete (unused dependencies) inside the quality gate"
        type: boolean
        default: true
      release-build:
        description: "On a pull request into main, build the release binaries for every target (rust-release-build.yml) so a target that fails to compile turns the PR red; rust-release.yml then publishes these binaries instead of rebuilding"
        type: boolean
        default: true
      release-binary-name:
        description: "Binary name for the release build; empty derives the first bin target from cargo metadata"
        type: string
        default: ""
      release-include-windows:
        description: "Include the Windows target in the release build (match the repo's release.yml)"
        type: boolean
        default: true
      release-system-packages-brew:
        description: "Homebrew formulae for the macOS release builds (match the repo's release.yml)"
        type: string
        default: ""
      main-pr-checks:
        description: "Validate version bump on main PR"
        type: boolean
        default: true

# CI only reads the checkout — least privilege. Release/publish workflows
# request write where they actually need it.
permissions:
  contents: read

# A newer push to the same ref supersedes in-flight CI; cancel the stale run.
concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ inputs.rust-version }}
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install system packages
        if: inputs.system-packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.system-packages }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Check formatting
        if: inputs.check-fmt
        run: cargo fmt -- --check

      - name: Run clippy
        if: inputs.run-clippy
        run: cargo clippy --locked --all-targets ${{ inputs.feature-flags }} -- -D warnings

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest
        if: inputs.run-tests && inputs.use-nextest

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov
        if: inputs.run-tests && inputs.run-coverage

      # The suite runs ONCE (decided 2026-09-30): with coverage on, the
      # instrumented llvm-cov run IS the test run — a failing test fails it
      # exactly like `cargo test` would — so no separate coverage job re-runs
      # the whole suite. --fail-under-lines 0 is a pure report.
      - name: Run tests (with coverage)
        if: inputs.run-tests && inputs.run-coverage
        env:
          IGNORE_REGEX: ${{ inputs.coverage-ignore-regex }}
        run: |
          ignore=""
          if [ -n "$IGNORE_REGEX" ]; then
            ignore="--ignore-filename-regex $IGNORE_REGEX"
          fi
          runner=""
          if [ "${{ inputs.use-nextest }}" = "true" ]; then
            runner="nextest"
          fi
          cargo llvm-cov $runner --locked ${{ inputs.feature-flags }} $ignore \
            --fail-under-lines ${{ inputs.coverage-threshold }} \
            --summary-only

      - name: Run tests
        if: inputs.run-tests && !inputs.run-coverage
        run: |
          if [ "${{ inputs.use-nextest }}" = "true" ]; then
            cargo nextest run --locked ${{ inputs.feature-flags }}
          else
            cargo test --locked ${{ inputs.feature-flags }}
          fi

  publish-check:
    name: Publish Check
    if: inputs.publish-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ inputs.rust-version }}

      - name: Install system packages
        if: inputs.system-packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.system-packages }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Dry-run publish
        run: cargo publish --locked --dry-run

      # The dry run packages and verifies locally but never uploads, and the
      # size ceiling only exists server-side — so a green dry run says nothing
      # about whether the publish will fit. crates.io does not reject an
      # oversized upload cleanly either: it resets the HTTP/2 stream, which
      # reads like a network fault. Measure the .crate the dry run already
      # produced and fail here, where the log can name the offending file.
      - name: Check package size
        run: |
          crate=$(ls -1 target/package/*.crate 2>/dev/null | head -1)
          if [ -z "$crate" ]; then
            echo "No .crate produced by the dry run — nothing to measure."
            exit 0
          fi
          size=$(stat -c%s "$crate")
          limit=$(( ${{ inputs.max-package-mib }} * 1024 * 1024 ))
          printf 'Package: %s\nSize:    %s bytes (%.2f MiB)\nLimit:   %s MiB\n' \
            "$crate" "$size" "$(echo "$size" | awk '{print $1/1048576}')" \
            "${{ inputs.max-package-mib }}"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::Package exceeds ${{ inputs.max-package-mib }} MiB; crates.io rejects uploads over 10 MiB."
            echo "Largest files in the package:"
            cargo package --locked --list --allow-dirty 2>/dev/null \
              | while read -r f; do
                  [ -f "$f" ] && printf '%10s  %s\n' "$(stat -c%s "$f")" "$f"
                done | sort -rn | head -10
            echo "Fix: add an 'exclude' list to Cargo.toml so assets stay out of the package."
            exit 1
          fi

  quality:
    name: Quality Gate
    if: inputs.run-quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The gate's single definition lives in this repo; the quality graph runs
      # the same script locally.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: UniverLab/workflows
          ref: main
          path: .univerlab-workflows
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ inputs.rust-version }}
          components: clippy

      - name: Install system packages
        if: inputs.system-packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.system-packages }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny,cargo-machete

      - name: Quality gate
        env:
          QUALITY_MAX_FILE_LINES: ${{ inputs.quality-max-file-lines }}
          QUALITY_FN_LINES: ${{ inputs.quality-fn-lines }}
          QUALITY_COGNITIVE: ${{ inputs.quality-cognitive }}
          QUALITY_NESTING: ${{ inputs.quality-nesting }}
          QUALITY_ARGS: ${{ inputs.quality-args }}
          QUALITY_TYPE_COMPLEXITY: ${{ inputs.quality-type-complexity }}
          QUALITY_DENY: ${{ inputs.run-deny && '1' || '0' }}
          QUALITY_MACHETE: ${{ inputs.run-machete && '1' || '0' }}
          QUALITY_FEATURES: ${{ inputs.feature-flags }}
        run: bash .univerlab-workflows/scripts/rust-quality.sh

  main-pr-checks:
    name: Main PR Version Bump
    if: >-
      inputs.main-pr-checks &&
      github.event_name == 'pull_request' &&
      github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check version bump
        run: |
          CURRENT_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "//' | sed 's/".*//')
          BASE_VERSION=$(git show origin/main:Cargo.toml | grep '^version' | head -1 | sed 's/version = "//' | sed 's/".*//')

          if [ "$CURRENT_VERSION" = "$BASE_VERSION" ]; then
            echo "❌ Version in Cargo.toml must be bumped for main PR"
            exit 1
          fi
          echo "✅ Version bumped: $BASE_VERSION → $CURRENT_VERSION"

  release-build:
    name: Release build
    if: >-
      inputs.release-build &&
      github.event_name == 'pull_request' &&
      github.base_ref == 'main'
    uses: UniverLab/workflows/.github/workflows/rust-release-build.yml@main
    with:
      binary-name: ${{ inputs.release-binary-name }}
      system-packages: ${{ inputs.system-packages }}
      system-packages-brew: ${{ inputs.release-system-packages-brew }}
      include-windows: ${{ inputs.release-include-windows }}

  # One stable check name for branch protection ("rust-ci / Release Build").
  # A skipped release build (a PR that does not target main) passes; a failed
  # or cancelled target fails it.
  release-gate:
    name: Release Build
    needs: release-build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          result="${{ needs.release-build.result }}"
          echo "release build: $result"
          case "$result" in
            success|skipped) exit 0 ;;
            *) echo "::error::the release build failed for at least one target"; exit 1 ;;
          esac
