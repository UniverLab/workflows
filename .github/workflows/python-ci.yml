name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version (default: 3.11)"
        type: string
        default: "3.11"
      system-packages:
        description: "Space-separated system packages to install (e.g., 'libfftw3-dev')"
        type: string
        default: ""
      check-format:
        description: "Run ruff format --check"
        type: boolean
        default: true
      run-lint:
        description: "Run ruff check"
        type: boolean
        default: true
      run-typecheck:
        description: "Run mypy type checking"
        type: boolean
        default: true
      run-tests:
        description: "Run pytest"
        type: boolean
        default: true
      run-coverage:
        description: "Measure coverage with pytest-cov (repo must depend on pytest-cov)"
        type: boolean
        default: false
      coverage-threshold:
        description: "Fail if test coverage drops below this percent (0 = report only)"
        type: number
        default: 0

# CI only reads the checkout — least privilege.
permissions:
  contents: read

# A newer push to the same ref supersedes in-flight CI; cancel the stale run.
concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, Lint, TypeCheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install system packages
        if: inputs.system-packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.system-packages }}

      # --frozen fails if uv.lock is out of date — the lockfile is authoritative.
      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Check formatting
        if: inputs.check-format
        run: uv run ruff format --check .

      - name: Run linter
        if: inputs.run-lint
        run: uv run ruff check .

      - name: Run type checker
        if: inputs.run-typecheck
        run: uv run mypy src/

      - name: Run tests
        if: inputs.run-tests && !inputs.run-coverage
        run: uv run pytest -v

      # Opt-in: needs pytest-cov. --cov-fail-under 0 is a pure report; pass
      # coverage-threshold to gate.
      - name: Run tests with coverage
        if: inputs.run-tests && inputs.run-coverage
        run: uv run pytest -v --cov --cov-report=term-missing --cov-fail-under=${{ inputs.coverage-threshold }}
