name: Rust Mutants

# On-demand mutation testing for any UniverLab Rust crate (decided 2026-09-30).
# It never runs on a PR or a schedule: cargo-mutants re-runs the whole test
# suite once per mutant, which is too expensive to gate every PR and brought
# the workstation down when it ran locally. Canopy's quality graph dispatches
# it once per large block of specs, waits for it, and reads the report.
#
#   gh workflow run rust-mutants.yml -R UniverLab/workflows \
#     -f repository=UniverLab/gitkit -f ref=feature/sv-update -f base=develop \
#     -f request-id=<unique id>
#
# The run title carries the request id so the caller can find its run. The
# `mutants-report` artifact holds missed.txt, timeout.txt and summary.txt; the
# run fails when any mutant is missed or times out.

run-name: "mutants ${{ inputs.repository }}@${{ inputs.ref }} [${{ inputs.request-id }}]"

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Crate repository, owner/name (e.g. UniverLab/gitkit)"
        required: true
        type: string
      ref:
        description: "Branch or SHA to test (must be pushed)"
        required: true
        type: string
      base:
        description: "Base branch: mutants cover the diff from the merge-base with it"
        required: false
        default: develop
        type: string
      shards:
        description: "Parallel runners the mutants are split across"
        required: false
        default: "4"
        type: string
      jobs:
        description: "cargo-mutants --jobs inside each runner"
        required: false
        default: "2"
        type: string
      test-tool:
        description: "cargo or nextest"
        required: false
        default: cargo
        type: string
      system-packages:
        description: "Space-separated apt packages the crate needs to build"
        required: false
        default: ""
        type: string
      features:
        description: "Feature flags passed to cargo-mutants (e.g. --all-features); empty = default features"
        required: false
        default: ""
        type: string
      request-id:
        description: "Opaque id echoed in the run title so a caller can find this run"
        required: false
        default: manual
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        run: |
          n="${{ inputs.shards }}"
          case "$n" in ''|*[!0-9]*) echo "shards must be a number"; exit 1;; esac
          [ "$n" -ge 1 ] && [ "$n" -le 16 ] || { echo "shards must be 1..16"; exit 1; }
          echo "shards=$(python3 -c "import json;print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"

  shard:
    name: Mutants shard ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Install system packages
        if: inputs.system-packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.system-packages }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-mutants,nextest

      - name: Diff against the base
        id: diff
        env:
          BASE: ${{ inputs.base }}
        run: |
          git fetch --no-tags origin "$BASE"
          mb="$(git merge-base FETCH_HEAD HEAD)"
          git diff "$mb" HEAD -- '*.rs' > "$RUNNER_TEMP/diff.patch"
          echo "merge-base $mb, $(wc -l < "$RUNNER_TEMP/diff.patch") diff lines"
          if [ -s "$RUNNER_TEMP/diff.patch" ]; then echo "empty=false" >> "$GITHUB_OUTPUT"; else echo "empty=true" >> "$GITHUB_OUTPUT"; fi

      - name: cargo mutants (shard ${{ matrix.shard }}/${{ inputs.shards }})
        if: steps.diff.outputs.empty == 'false'
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
          JOBS: ${{ inputs.jobs }}
          TEST_TOOL: ${{ inputs.test-tool }}
          FEATURES: ${{ inputs.features }}
        run: |
          # Memory-capped cgroup around cargo-mutants: a mutant that allocates
          # without bound (an endless loop pushing into a Vec) is OOM-killed on
          # its own, and cargo-mutants records its test as failed. Uncapped, it
          # exhausts the VM and GitHub stops the runner, losing the shard's
          # whole report (texforge, 2026-09-30/10-01). Falls back to running
          # uncapped if the cgroup cannot be set up.
          cg=/sys/fs/cgroup/mutants
          limit=$(( $(awk '/^MemTotal:/ {print $2}' /proc/meminfo) * 1024 * 3 / 4 ))
          if sudo mkdir -p "$cg" \
             && echo "$limit" | sudo tee "$cg/memory.max" >/dev/null \
             && { echo 0 | sudo tee "$cg/memory.swap.max" >/dev/null || true; } \
             && echo $$ | sudo tee "$cg/cgroup.procs" >/dev/null; then
            echo "memory cap: $(( limit / 1024 / 1024 )) MiB (cgroup $cg)"
          else
            echo "::warning::memory cap unavailable; running cargo-mutants uncapped"
            cg=""
          fi
          set +e
          # shellcheck disable=SC2086
          cargo mutants --in-diff "$RUNNER_TEMP/diff.patch" --shard "$SHARD/$SHARDS" \
            --jobs "$JOBS" --test-tool "$TEST_TOOL" --no-shuffle $FEATURES
          rc=$?
          if [ -n "$cg" ]; then
            peak=$(cat "$cg/memory.peak" 2>/dev/null || echo 0)
            ooms=$(awk '/^oom_kill / {print $2}' "$cg/memory.events" 2>/dev/null)
            echo "memory peak: $(( peak / 1024 / 1024 )) MiB, OOM kills inside the cap: ${ooms:-0}"
            echo "shard $SHARD: memory peak $(( peak / 1024 / 1024 )) MiB, OOM kills ${ooms:-0}" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc

      - name: Upload shard output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: Report
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutants-shard-*
          path: shards

      - name: Merge shard outcomes
        run: |
          mkdir -p report
          for f in missed timeout caught unviable; do
            cat shards/*/"$f".txt 2>/dev/null | sort > "report/$f.txt" || true
          done
          {
            echo "repository: ${{ inputs.repository }}"
            echo "ref: ${{ inputs.ref }} (base ${{ inputs.base }})"
            echo "shards: ${{ inputs.shards }}, shard jobs result: ${{ needs.shard.result }}"
            for f in caught missed timeout unviable; do printf '%s: %s\n' "$f" "$(wc -l < "report/$f.txt")"; done
          } | tee report/summary.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat report/summary.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -s report/missed.txt ]; then { echo "### Missed"; echo '```'; cat report/missed.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-report
          path: report
          retention-days: 30

      - name: Verdict
        run: |
          if [ "${{ needs.shard.result }}" != "success" ] && [ ! -s report/missed.txt ] && [ ! -s report/timeout.txt ]; then
            echo "a shard failed without reporting missed or timed-out mutants (baseline or build failure): see the shard logs"; exit 1
          fi
          if [ -s report/missed.txt ] || [ -s report/timeout.txt ]; then
            echo "$(wc -l < report/missed.txt) missed, $(wc -l < report/timeout.txt) timed out"; exit 1
          fi
          echo "no surviving mutants"
