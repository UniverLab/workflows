name: Rust Release

on:
  workflow_call:
    inputs:
      binary-name:
        description: "Binary/crate name (e.g. texforge, gitkit)"
        type: string
        required: true
      system-packages:
        description: "Space-separated apt packages to install before building (e.g. 'protobuf-compiler libssl-dev')"
        type: string
        default: ""
      system-packages-brew:
        description: "Space-separated Homebrew formulae for the macOS build targets (e.g. 'protobuf'). Kept separate from system-packages because the names rarely match across package managers — protobuf-compiler on apt is protobuf on brew."
        type: string
        default: ""
      include-windows:
        description: "Build and release a native Windows (x86_64-pc-windows-msvc) binary"
        type: boolean
        default: true
      ci-workflow:
        description: "File name of the repo's CI workflow whose pull-request run built the release binaries (rust-ci.yml's release-build)"
        type: string
        default: ci.yml

permissions:
  contents: write
  # Read the release binaries the PR's CI run built (cross-run artifact
  # download). The caller must grant it too; without it the release rebuilds.
  actions: read

# Serialize releases per caller repo — never cancel a release mid-flight, but
# don't let two run at once and race on tag/publish.
concurrency:
  group: rust-release-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  create-tag:
    name: Create Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.create.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/' | tr -d '\r' | xargs)
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        id: create
        run: |
          if [ "${{ steps.check_tag.outputs.exists }}" = "true" ]; then
            echo "created=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.tag }} already exists — skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
          echo "created=true" >> $GITHUB_OUTPUT

  # Reuse the binaries the pull request's CI run already built and verified
  # (rust-ci.yml → release-build), but only when they were built from exactly
  # the tree this tag points at: main can move between the last PR run and the
  # merge, and a binary of other code must never be published.
  resolve:
    name: Reuse PR release build
    needs: create-tag
    if: needs.create-tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      reuse: ${{ steps.resolve.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create-tag.outputs.tag }}
          persist-credentials: false

      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TAG: ${{ needs.create-tag.outputs.tag }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
        run: |
          reuse=false
          finish() { echo "reuse=$reuse" >> "$GITHUB_OUTPUT"; echo "reuse=$reuse — $1"; exit 0; }
          [ -n "$HEAD_SHA" ] || finish "not a merged pull request (manual dispatch): building"
          run_id=$(gh run list -R "$REPO" --workflow "$CI_WORKFLOW" --commit "$HEAD_SHA" \
            --event pull_request --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null)
          [ -n "$run_id" ] || finish "no successful $CI_WORKFLOW run for $HEAD_SHA: building"
          gh run download "$run_id" -R "$REPO" -n release-meta -D meta 2>/dev/null \
            || finish "run $run_id has no release-meta (or actions: read is missing): building"
          want_tree=$(git rev-parse "HEAD^{tree}")
          got_tree=$(jq -r .tree meta/meta.json)
          got_tag=$(jq -r .tag meta/meta.json)
          [ "$got_tag" = "$TAG" ] || finish "PR built $got_tag, releasing $TAG: building"
          [ "$got_tree" = "$want_tree" ] || finish "PR tree $got_tree != tag tree $want_tree (main moved): building"
          gh run download "$run_id" -R "$REPO" -p 'release-pkg-*' -D pkgs \
            || finish "could not download the packages of run $run_id: building"
          ls -la pkgs/*/
          reuse=true
          echo "run=$run_id" >> "$GITHUB_OUTPUT"
          finish "reusing the binaries built by run $run_id (tree $want_tree)"

      # Re-home the reused packages in this run under the names the build job
      # would have used, so the release job reads one artifact set either way.
      - name: Re-upload reused packages
        if: steps.resolve.outputs.reuse == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-pkg-reused
          path: pkgs/*/*
          if-no-files-found: error

  build:
    name: Build
    needs: [create-tag, resolve]
    if: needs.create-tag.outputs.created == 'true' && needs.resolve.outputs.reuse != 'true'
    uses: UniverLab/workflows/.github/workflows/rust-release-build.yml@main
    with:
      binary-name: ${{ inputs.binary-name }}
      ref: ${{ needs.create-tag.outputs.tag }}
      system-packages: ${{ inputs.system-packages }}
      system-packages-brew: ${{ inputs.system-packages-brew }}
      include-windows: ${{ inputs.include-windows }}

  github-release:
    name: Create GitHub Release
    needs: [create-tag, resolve, build]
    if: >-
      always() &&
      needs.create-tag.outputs.created == 'true' &&
      (needs.resolve.outputs.reuse == 'true' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-pkg-*
          path: artifacts
          merge-multiple: true

      # One checksum file users (and the install scripts) can verify against.
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-tag.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*

  ensure-owners:
    name: Ensure crates.io owners
    needs: create-tag
    if: needs.create-tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Add crates.io owners (best-effort)
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No CARGO_REGISTRY_TOKEN — skipping owners update"
            exit 0
          fi
          cargo owner --token "$TOKEN" --add github:univerlab:owners ${{ inputs.binary-name }} || true

  # No manual approval (decided 2026-09-30): the release PR already carried
  # every gate, including the release build itself; publishing follows the
  # GitHub release automatically.
  publish:
    name: Publish to crates.io
    needs: [create-tag, github-release, ensure-owners]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system packages
        if: inputs.system-packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.system-packages }}

      - name: Check stable version
        id: version_check
        run: |
          VERSION=${{ needs.create-tag.outputs.version }}
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> $GITHUB_OUTPUT
          else
            echo "is_stable=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION is prerelease — skipping publish"
          fi

      - name: Cargo publish
        if: steps.version_check.outputs.is_stable == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --allow-dirty
